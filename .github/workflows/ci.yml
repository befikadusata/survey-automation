name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: surveydb_test
          POSTGRES_USER: survey
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Verify Migrations
        run: npm run migrate
        env:
          DATABASE_URL: postgresql://survey:password@localhost:5432/surveydb_test

  docker-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: false
          tags: survey-automation-app:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
